[workspace]
name = "ComfyUI"
channels = ["nvidia", "conda-forge", "pytorch"]
platforms = ["linux-64"]

[system-requirements]
cuda = "13.0"
libc = "2.31"

[environments]
default = { solve-group = "default" }
novaflow = { features = ["novaflow"], solve-group = "default" }

[tasks]
start = "python main.py --listen 0.0.0.0 --use-sage-attention"

[dependencies]
python = "3.12.*"
pip = "*"
numpy = "<2.0.0"
pillow = "*"
scipy = "*"
tqdm = "*"
psutil = "*"
pyyaml = "*"
alembic = "*"
sqlalchemy = "*"

[pypi-options]
index-strategy = "unsafe-best-match"
no-build-isolation = ["torch", "torchvision", "torchaudio", "xformers", "sageattention"]
extra-index-urls = ["https://download.pytorch.org/whl/nightly/cu130"]

[pypi-dependencies]
# PyTorch Nightly for Blackwell (cu130)
torch = { version = ">=2.7.0.dev" }
torchvision = { version = ">=0.22.0.dev" }
torchaudio = { version = ">=2.7.0.dev" }

# ComfyUI base
comfyui-frontend-package = "==1.35.9"
comfyui-workflow-templates = "==0.7.65"
comfyui-embedded-docs = "==0.3.1"
torchsde = "*"
einops = "*"
transformers = ">=4.50.3"
tokenizers = ">=0.13.3"
sentencepiece = "*"
safetensors = ">=0.4.2"
aiohttp = ">=3.11.8"
yarl = ">=1.18.0"
av = ">=14.2.0"
kornia = ">=0.7.1"
spandrel = "*"
pydantic = "~=2.0"
pydantic-settings = "~=2.0"
sageattention = "*"

# --- Features ---

[feature.novaflow.tasks]
setup_sam3 = "pip install -e custom_nodes/novaflow-v2/sam3 --no-deps"
setup_da3 = "export TORCH_CUDA_ARCH_LIST='12.0' && pip uninstall -y xformers && pip install xformers --no-deps --no-build-isolation --no-binary xformers && pip install -e custom_nodes/novaflow-v2/Depth-Anything-3 --no-deps"
setup_tapi3d = "cd custom_nodes/novaflow-v2/TAPIP3D/third_party/pointops2 && export CUDA_HOME=$CONDA_PREFIX && python setup.py install"
build = {depends-on = ["setup_sam3", "setup_da3", "setup_tapi3d"]}
clean = "rm -rf custom_nodes/novaflow-v2/**/build custom_nodes/novaflow-v2/**/*.egg-info"

[feature.novaflow.dependencies]
cuda-toolkit = "==13.0"
ninja = "*"
cmake = "*"
gxx_linux-64 = "*"

[feature.novaflow.pypi-dependencies]
open3d = "==0.19.0"
pycolmap = "==3.10.0"
lightning = ">=2.5.0"
typed-argument-parser = "*"
hydra-core = "*"
rich = "*"
h5py = "*"
sophuspy = "*"
opencv-python = "*"
rerun-sdk = "~=0.21"
matplotlib = "*"
imageio = "*"
trimesh = "*"
huggingface-hub = { version = ">=0.22", extras = ["torch"] }
python-box = { version = "~=7.0", extras = ["all"] }
timm = "*"
wandb = "*"
lightning-utilities = "*"
torchmetrics = "*"
roma = "*"
gradio = "*"
viser = "*"
pillow-heif = "*"
jaxtyping = "*"
lpips = "*"
colorspacious = "*"
moviepy = "==1.0.3"
plyfile = "*"
tyro = "*"
omegaconf = "*"
fastapi = "*"
uvicorn = "*"
pre-commit = "*"
tensorboardX = "*"
rootutils = "*"
pytest = "*"
e3nn = "*"
evo = "*"
